name: Actualizar eventos

on:
  schedule:
    - cron: "17 11 * * *"   # todos los días 6:17 a. m. hora de Lima (los tours se actualizan los lunes)
  workflow_dispatch:         # botón "Run workflow"
    inputs:
      tours:
        description: "Actualizar también tours y full days"
        type: boolean
        default: true
      google:
        description: "Volver a consultar Google Maps (restaurantes, cafés y bares). Normalmente NO hace falta"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrapear todas las fuentes
        env:
          PYTHONUNBUFFERED: "1"
          FORM_CSV_URL: ${{ vars.FORM_CSV_URL }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          FORZAR_TOURS: ${{ github.event_name == 'workflow_dispatch' && inputs.tours && '1' || '0' }}
          FORZAR_GOOGLE: ${{ github.event_name == 'workflow_dispatch' && inputs.google && '1' || '0' }}
        run: python scraper/scrape.py

      - name: Guardar cambios
        run: |
          git config user.name "plancito-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ img/cache/ agenda.html sitemap.xml
          git diff --cached --quiet && echo "Sin cambios" || (git commit -m "Datos actualizados $(date -u +%F)" && git push)
